minimumReleaseAgeExclude:
  - "@planeward/app-sdk@0.2.1"

# `tsc` is TypeScript 7 (native, fast typecheck) through `@typescript/native`.
# Tools that need the JavaScript compiler API (ESLint) get TypeScript 6
# through the `typescript` alias and this override.
overrides:
  typescript: npm:@typescript/typescript6@^6.0.2

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
