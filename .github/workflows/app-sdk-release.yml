name: Release app SDK

on:
  push:
    tags:
      - "app-sdk-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. app-sdk-v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: app-sdk-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release version
        id: get_version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          if ! echo "$TAG" | grep -Eq '^app-sdk-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Invalid version tag: $TAG (expected app-sdk-vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#app-sdk-v}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ steps.get_version.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Provenance (npm --provenance) needs a public repo. Once this repo is
      # public, add `id-token: write` to the permissions and pass
      # `--provenance` to the publish step below.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/app-sdk/package.json').version")
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "Tag version $VERSION does not match packages/app-sdk/package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build
        run: pnpm --filter @planeward/app-sdk build

      - name: Typecheck
        run: pnpm --filter @planeward/app-sdk typecheck

      - name: Test
        run: pnpm --filter @planeward/app-sdk test

      - name: Lint
        run: pnpm --filter @planeward/app-sdk lint

      - name: Publish to npm
        run: pnpm --filter @planeward/app-sdk publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
