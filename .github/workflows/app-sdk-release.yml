name: Release app SDK

on:
  push:
    tags:
      - "app-sdk-v*.*.*"

permissions:
  id-token: write # npm trusted publishing (OIDC)
  contents: write # GitHub release

concurrency:
  group: app-sdk-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          VERSION="${GITHUB_REF_NAME#app-sdk-v}"
          PACKAGE_VERSION=$(node -p "require('./packages/app-sdk/package.json').version")
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "Tag version $VERSION does not match packages/app-sdk/package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build
        run: pnpm --filter @planeward/app-sdk build

      - name: Typecheck
        run: pnpm --filter @planeward/app-sdk typecheck

      - name: Test
        run: pnpm --filter @planeward/app-sdk test

      - name: Lint
        run: pnpm --filter @planeward/app-sdk lint

      - name: Publish to npm
        run: pnpm --filter @planeward/app-sdk publish --no-git-checks --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
